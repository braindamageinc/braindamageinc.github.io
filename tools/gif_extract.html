<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIF Frame Extractor</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #1e1e24; color: #eee; }
  h1 { margin-top: 0; font-size: 1.4rem; }
  button, label.btn { background: #4a7bd0; color: #fff; border: 0; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-size: 14px; }
  button:disabled { background: #555; cursor: default; }
  input[type=file] { display: none; }
  section { background: #2a2a33; padding: 14px; border-radius: 8px; margin-bottom: 16px; }
  #preview { max-width: 100%; max-height: 360px; background: repeating-conic-gradient(#444 0 25%, #333 0 50%) 0 0/16px 16px; image-rendering: pixelated; }
  #info { margin: 8px 0; color: #9cf; }
  #frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .frame { background: #1e1e24; padding: 6px; border-radius: 6px; text-align: center; font-size: 12px; }
  .frame canvas { max-width: 100%; background: repeating-conic-gradient(#444 0 25%, #333 0 50%) 0 0/12px 12px; image-rendering: pixelated; }
  .frame a { color: #8bf; display: block; margin-top: 4px; }
  #status { color: #fa6; }
</style>
</head>
<body>
<h1>GIF Frame Extractor</h1>

<section>
  <label class="btn">Open image…<input id="file" type="file" accept="image/*"></label>
  <span id="status"></span>
  <div id="info"></div>
  <img id="preview" alt="" hidden>
</section>

<section>
  <button id="extract" disabled>Extract frames</button>
  <button id="zip" disabled>Download all (.zip)</button>
  <div id="frames" style="margin-top:12px"></div>
</section>

<script>
const $ = id => document.getElementById(id);
let fileBytes = null, fileName = "image", frames = [];   // frames: [{canvas, blob}]

$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  fileName = f.name.replace(/\.[^.]+$/, "");
  fileBytes = new Uint8Array(await f.arrayBuffer());
  frames = []; $("frames").innerHTML = ""; $("zip").disabled = true; $("status").textContent = "";
  const url = URL.createObjectURL(f);
  const img = $("preview");
  img.onload = () => {
    $("info").textContent = `${f.name} — ${img.naturalWidth} × ${img.naturalHeight} px, ${(f.size/1024).toFixed(1)} KB, ${f.type || "unknown type"}`;
    $("extract").disabled = false;
  };
  img.onerror = () => { $("info").textContent = "Could not display this file as an image."; $("extract").disabled = true; };
  img.src = url; img.hidden = false;
};

$("extract").onclick = async () => {
  $("status").textContent = "Extracting…";
  $("extract").disabled = true;
  try {
    const isGif = String.fromCharCode(...fileBytes.slice(0, 3)) === "GIF";
    let canvases;
    if (isGif) canvases = decodeGif(fileBytes);
    else {                       // non-GIF: single frame, like PIL would for a still image
      const c = document.createElement("canvas");
      c.width = $("preview").naturalWidth; c.height = $("preview").naturalHeight;
      c.getContext("2d").drawImage($("preview"), 0, 0);
      canvases = [c];
    }
    frames = [];
    $("frames").innerHTML = "";
    for (let i = 0; i < canvases.length; i++) {
      const blob = await new Promise(r => canvases[i].toBlob(r, "image/png"));
      frames.push({ canvas: canvases[i], blob, name: `frame_${i + 1}.png` });
      const d = document.createElement("div"); d.className = "frame";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = frames[i].name; a.textContent = "Download " + frames[i].name;
      d.append(canvases[i], document.createElement("br"), `frame_${i + 1}`, a);
      $("frames").append(d);
    }
    $("status").textContent = `Extracted ${frames.length} frame(s).`;
    $("zip").disabled = false;
  } catch (err) {
    $("status").textContent = "Error: " + err.message;
  }
  $("extract").disabled = false;
};

$("zip").onclick = async () => {
  const files = [];
  for (const f of frames) files.push({ name: f.name, data: new Uint8Array(await f.blob.arrayBuffer()) });
  const blob = makeZip(files);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fileName + "_frames.zip"; a.click();
};

// ---------- GIF decoder (composited full-size frames) ----------
function decodeGif(b) {
  let p = 6;
  const u16 = () => { const v = b[p] | (b[p + 1] << 8); p += 2; return v; };
  const W = u16(), H = u16();
  const flags = b[p++]; const bgIndex = b[p++]; p++;
  let gct = null;
  if (flags & 0x80) { const n = 3 << ((flags & 7) + 1); gct = b.subarray(p, p + n); p += n; }

  const out = [];
  let canvas = new Uint8ClampedArray(W * H * 4);     // running composite
  let gce = null;
  const skipSub = () => { while (b[p]) p += b[p] + 1; p++; };

  while (p < b.length) {
    const t = b[p++];
    if (t === 0x3B) break;
    if (t === 0x21) {
      const label = b[p++];
      if (label === 0xF9) {
        p++; const f = b[p++]; u16(); const ti = b[p++]; p++;   // size, flags, delay, transparent idx, terminator
        gce = { disposal: (f >> 2) & 7, transparent: (f & 1) ? ti : -1 };
      } else skipSub();
    } else if (t === 0x2C) {
      const x0 = u16(), y0 = u16(), w = u16(), h = u16();
      const lf = b[p++];
      let ct = gct;
      if (lf & 0x80) { const n = 3 << ((lf & 7) + 1); ct = b.subarray(p, p + n); p += n; }
      const interlaced = !!(lf & 0x40);
      const minCode = b[p++];
      const data = [];
      while (b[p]) { for (let i = 0; i < b[p]; i++) data.push(b[p + 1 + i]); p += b[p] + 1; }
      p++;
      const idx = lzw(data, minCode, w * h);

      const prev = gce && gce.disposal === 3 ? canvas.slice() : null;
      const rowMap = interlaceRows(h, interlaced);
      for (let y = 0; y < h; y++) {
        const dy = y0 + rowMap[y];
        if (dy >= H) continue;
        for (let x = 0; x < w; x++) {
          const dx = x0 + x; if (dx >= W) continue;
          const c = idx[y * w + x];
          if (gce && c === gce.transparent) continue;
          const o = (dy * W + dx) * 4;
          canvas[o] = ct[c * 3]; canvas[o + 1] = ct[c * 3 + 1]; canvas[o + 2] = ct[c * 3 + 2]; canvas[o + 3] = 255;
        }
      }
      const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      cv.getContext("2d").putImageData(new ImageData(canvas.slice(), W, H), 0, 0);
      out.push(cv);

      if (gce) {
        if (gce.disposal === 2) {
          for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
            const dy = y0 + y, dx = x0 + x; if (dy >= H || dx >= W) continue;
            canvas.fill(0, (dy * W + dx) * 4, (dy * W + dx) * 4 + 4);
          }
        } else if (gce.disposal === 3 && prev) canvas = prev;
      }
      gce = null;
    } else throw new Error("Corrupt GIF");
  }
  if (!out.length) throw new Error("No frames found");
  return out;
}

function interlaceRows(h, il) {
  const m = new Array(h);
  if (!il) { for (let i = 0; i < h; i++) m[i] = i; return m; }
  let r = 0;
  for (const [s, st] of [[0, 8], [4, 8], [2, 4], [1, 2]]) for (let y = s; y < h; y += st) m[r++] = y;
  return m;
}

function lzw(data, minCode, size) {
  const out = new Uint8Array(size);
  const clear = 1 << minCode, eoi = clear + 1;
  let codeSize = minCode + 1, next = eoi + 1;
  const prefix = new Int16Array(4096), suffix = new Uint8Array(4096), stack = new Uint8Array(4097);
  for (let i = 0; i < clear; i++) suffix[i] = i;
  let bits = 0, nb = 0, pos = 0, op = 0, old = -1, first = 0;
  while (op < size) {
    while (nb < codeSize && pos < data.length) { bits |= data[pos++] << nb; nb += 8; }
    if (nb < codeSize) break;
    let code = bits & ((1 << codeSize) - 1);
    bits >>= codeSize; nb -= codeSize;
    if (code === clear) { codeSize = minCode + 1; next = eoi + 1; old = -1; continue; }
    if (code === eoi) break;
    if (old === -1) { out[op++] = suffix[code]; old = first = code; continue; }
    let cur = code, sp = 0;
    if (code >= next) { stack[sp++] = first; cur = old; }
    while (cur >= clear) { stack[sp++] = suffix[cur]; cur = prefix[cur]; }
    first = suffix[cur];
    stack[sp++] = first;
    if (next < 4096) {
      prefix[next] = old; suffix[next] = first; next++;
      if (next === (1 << codeSize) && codeSize < 12) codeSize++;
    }
    old = code;
    while (sp > 0 && op < size) out[op++] = stack[--sp];
  }
  return out;
}

// ---------- minimal ZIP writer (stored, no compression) ----------
function makeZip(files) {
  const crcT = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; crcT[n] = c >>> 0; }
  const crc = d => { let c = ~0; for (let i = 0; i < d.length; i++) c = crcT[(c ^ d[i]) & 255] ^ (c >>> 8); return ~c >>> 0; };
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  for (const f of files) {
    const name = enc.encode(f.name), c = crc(f.data), n = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, c, true);
    h.setUint32(18, n, true); h.setUint32(22, n, true); h.setUint16(26, name.length, true);
    parts.push(h.buffer, name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint32(16, c, true); ch.setUint32(20, n, true); ch.setUint32(24, n, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    central.push(ch.buffer, name);
    off += 30 + name.length + n;
  }
  let cs = 0; for (const c of central) cs += c.byteLength;
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cs, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e.buffer], { type: "application/zip" });
}
</script>
</body>
</html>
