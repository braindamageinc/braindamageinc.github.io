<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chip Sound Lab</title>
<style>
:root{--bg:#14161c;--panel:#1e222b;--line:#2f3542;--fg:#e6e9ef;--dim:#8b93a5;--acc:#ffb347;--acc2:#5ad1c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 12px 0 0;color:var(--acc)}
main{display:grid;grid-template-columns:200px 1fr;gap:12px;padding:12px;max-width:1400px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0 0 8px}
button,select,input[type=number]{background:#2a3040;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:600}
#presets button{display:block;width:100%;margin-bottom:5px;text-align:left}
#voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.voice.off{opacity:.45}
.voice .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.voice .head b{color:var(--acc2)}
.row{display:grid;grid-template-columns:96px 1fr 52px;gap:6px;align-items:center;margin:2px 0}
.row label{color:var(--dim);font-size:12px}
.row output{text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
input[type=range]{width:100%;accent-color:var(--acc)}
canvas{width:100%;height:120px;background:#0c0e12;border:1px solid var(--line);border-radius:4px;display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.global{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px 16px}
.sp{flex:1}
</style>
</head>
<body>
<header>
  <h1>Chip Sound Lab</h1>
  <button class="primary" id="play">▶ Play (Space)</button>
  <button id="download">⬇ Download WAV</button>
  <button id="random">🎲 Randomize all</button>
  <button id="mutate">Mutate</button>
  <label><input type="checkbox" id="auto" checked> auto-play on change</label>
  <span class="sp"></span>
  <button id="saveJson">Save patch</button>
  <button id="loadJson">Load patch</button>
  <input type="file" id="file" accept=".json" hidden>
</header>
<main>
  <aside>
    <div class="panel" id="presets"><h2>Presets</h2></div>
  </aside>
  <section style="display:grid;gap:12px;align-content:start">
    <div class="panel"><canvas id="scope" width="1200" height="240"></canvas><div id="info" style="color:var(--dim);margin-top:4px"></div></div>
    <div class="panel"><h2>Global / 16-bit output</h2><div class="global" id="global"></div></div>
    <div id="voices"></div>
  </section>
</main>
<script>
"use strict";
// ---------- parameter definitions ----------
const WAVES=["square","saw","triangle","sine","noise","tri-noise (16-bit)","pulse25"];
const VP=[ // key,label,min,max,step,default
 ["freq","Frequency Hz",30,4000,1,440],
 ["slide","Slide (oct/s)",-4,4,.01,0],
 ["dslide","Delta slide",-8,8,.01,0],
 ["vibD","Vibrato depth",0,1,.01,0],
 ["vibS","Vibrato speed Hz",0,30,.1,8],
 ["arp","Arp (semitones)",-24,24,1,0],
 ["arpT","Arp time s",.01,.5,.01,.1],
 ["duty","Square duty",.05,.95,.01,.5],
 ["dutyS","Duty sweep",-1,1,.01,0],
 ["delay","Start offset s",0,1,.01,0],
 ["att","Attack s",0,1,.005,.005],
 ["sus","Sustain s",0,2,.005,.15],
 ["punch","Punch",0,1,.01,0],
 ["dec","Decay s",0,2,.005,.2],
 ["lp","Low-pass Hz",100,20000,10,20000],
 ["lpS","LP sweep (oct/s)",-8,8,.1,0],
 ["hp","High-pass Hz",20,5000,10,20],
 ["vol","Volume",0,1,.01,.7],
 ["pan","Pan L-R",-1,1,.01,0],
];
const GP=[
 ["master","Master volume",0,1,.01,.8],
 ["rate","Sample rate Hz",4000,48000,1000,22050],
 ["bits","Bit depth (crush)",3,16,1,16],
 ["down","Downsample ×",1,16,1,1],
];
let state;
function newVoice(i){const v={on:i==0,wave:0};VP.forEach(p=>v[p[0]]=p[5]);return v;}
function newState(){return{g:Object.fromEntries(GP.map(p=>[p[0],p[5]])),v:[0,1,2,3].map(newVoice)};}

// ---------- synthesis ----------
function renderVoice(v,rate,L,R){
  const start=Math.floor(v.delay*rate);
  const total=Math.floor((v.att+v.sus+v.dec)*rate);
  const pl=(1-v.pan)<1?1:1-v.pan, gl=Math.min(1,1-v.pan)*1, gr=Math.min(1,1+v.pan);
  let phase=0,f=v.freq,slide=v.slide,vibP=0,duty=v.duty,lpf=v.lp,lp1=0,lp2=0,hpPrev=0,hpIn=0;
  const lpS=v.lpS,arpN=Math.floor(v.arpT*rate);
  let noiseV=Math.random()*2-1,lastN=0,triN=0;
  const dt=1/rate;
  for(let i=0;i<total;i++){
    const t=i*dt;
    slide+=v.dslide*dt; f*=Math.pow(2,slide*dt);
    lpf*=Math.pow(2,lpS*dt);
    duty=Math.min(.95,Math.max(.05,duty+v.dutyS*dt*.5));
    let ff=f; if(v.arp&&Math.floor(i/arpN)%2==1) ff*=Math.pow(2,v.arp/12);
    vibP+=v.vibS*dt; if(v.vibD) ff*=1+Math.sin(vibP*6.2832)*v.vibD*.3;
    ff=Math.max(10,Math.min(rate/2,ff));
    const prev=phase; phase+=ff*dt; const wrapped=phase>=1; if(wrapped)phase-=1;
    let s;
    switch(v.wave){
      case 0:s=phase<duty?1:-1;break;
      case 1:s=1-2*phase;break;
      case 2:s=Math.abs(phase*4-2)-1;break;
      case 3:s=Math.sin(phase*6.2832);break;
      case 4:if(wrapped||i==0)noiseV=Math.random()*2-1;s=noiseV;break;
      case 5:{ // 16-bit-console style: stepped 4-bit-ish triangle + noise sprinkle
        const q=Math.round((Math.abs(phase*4-2)-1)*7)/7; if(wrapped)lastN=Math.random()*2-1; s=q*.85+lastN*.15;break;}
      case 6:s=phase<.25?1:-1;break;
    }
    // envelope
    let e;
    if(t<v.att) e=v.att>0?t/v.att:1;
    else if(t<v.att+v.sus) e=1+(1-(t-v.att)/Math.max(v.sus,1e-6))*v.punch*2;
    else e=1-(t-v.att-v.sus)/Math.max(v.dec,1e-6);
    e=Math.max(0,e);
    s*=e;
    // filters
    const a=Math.min(1,6.2832*Math.min(lpf,rate/2.2)/rate);
    lp1+=a*(s-lp1); lp2+=a*(lp1-lp2); s=lp2;
    const hpA=Math.exp(-6.2832*v.hp/rate);
    const out=hpA*(hpPrev+s-hpIn); hpIn=s; hpPrev=out; s=out;
    s*=v.vol;
    const k=start+i; if(k<L.length){L[k]+=s*gl;R[k]+=s*gr;}
  }
  return start+total;
}
function render(){
  const g=state.g,rate=g.rate;
  let maxLen=0;
  state.v.forEach(v=>{if(v.on)maxLen=Math.max(maxLen,Math.floor((v.delay+v.att+v.sus+v.dec)*rate)+1)});
  maxLen=Math.max(maxLen,1)+Math.floor(rate*.02);
  const L=new Float32Array(maxLen),R=new Float32Array(maxLen);
  state.v.forEach(v=>{if(v.on)renderVoice(v,rate,L,R)});
  // mix, crush
  const levels=Math.pow(2,g.bits-1)-1, hold=g.down;
  for(const ch of [L,R]){
    let held=0;
    for(let i=0;i<ch.length;i++){
      if(i%hold==0){let x=ch[i]*g.master*.5;x=Math.max(-1,Math.min(1,x));held=Math.round(x*levels)/levels;}
      ch[i]=held;
    }
  }
  return{L,R,rate};
}
function toWav(b){
  const n=b.L.length,buf=new ArrayBuffer(44+n*4),d=new DataView(buf);
  const w=(o,s)=>[...s].forEach((c,i)=>d.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF");d.setUint32(4,36+n*4,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,2,true);
  d.setUint32(24,b.rate,true);d.setUint32(28,b.rate*4,true);d.setUint16(32,4,true);d.setUint16(34,16,true);w(36,"data");d.setUint32(40,n*4,true);
  for(let i=0;i<n;i++){
    d.setInt16(44+i*4,Math.max(-32768,Math.min(32767,Math.round(b.L[i]*32767))),true);
    d.setInt16(46+i*4,Math.max(-32768,Math.min(32767,Math.round(b.R[i]*32767))),true);
  }
  return new Blob([buf],{type:"audio/wav"});
}

// ---------- playback ----------
let ctx,src,last;
function play(){
  last=render(); draw(last);
  document.getElementById("info").textContent=`${(last.L.length/last.rate).toFixed(2)} s · ${last.rate} Hz · 16-bit stereo WAV · ${(last.L.length*4/1024).toFixed(1)} KiB`;
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state=="suspended")ctx.resume();
  const ab=ctx.createBuffer(2,last.L.length,last.rate);
  ab.copyToChannel(last.L,0);ab.copyToChannel(last.R,1);
  if(src)try{src.stop()}catch(e){}
  src=ctx.createBufferSource();src.buffer=ab;src.connect(ctx.destination);src.start();
}
function draw(b){
  const c=document.getElementById("scope"),x=c.getContext("2d"),W=c.width,H=c.height;
  x.fillStyle="#0c0e12";x.fillRect(0,0,W,H);
  x.strokeStyle="#2f3542";x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();
  x.strokeStyle="#5ad1c4";x.beginPath();
  const n=b.L.length;
  for(let px=0;px<W;px++){
    const a=Math.floor(px/W*n),e=Math.max(a+1,Math.floor((px+1)/W*n));
    let mn=1,mx=-1;for(let i=a;i<e&&i<n;i++){const s=(b.L[i]+b.R[i])/2;if(s<mn)mn=s;if(s>mx)mx=s;}
    x.moveTo(px,H/2-mx*H/2*.95);x.lineTo(px,H/2-mn*H/2*.95-1);
  }
  x.stroke();
}

// ---------- UI ----------
function slider(parent,obj,p,onchange){
  const [k,label,min,max,step]=p;
  const r=document.createElement("div");r.className="row";
  r.innerHTML=`<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><output></output>`;
  const inp=r.querySelector("input"),out=r.querySelector("output");
  const sync=()=>{inp.value=obj[k];out.textContent=(+obj[k]).toFixed(step<.01?3:step<1?2:0)};
  inp.oninput=()=>{obj[k]=+inp.value;sync();onchange()};
  r._sync=sync;sync();parent.appendChild(r);return r;
}
let syncers=[];
function buildUI(){
  syncers=[];
  const g=document.getElementById("global");g.innerHTML="";
  GP.forEach(p=>syncers.push(slider(g,state.g,p,changed)));
  const vs=document.getElementById("voices");vs.innerHTML="";
  state.v.forEach((v,i)=>{
    const d=document.createElement("div");d.className="panel voice"+(v.on?"":" off");
    d.innerHTML=`<div class="head"><label><input type="checkbox" ${v.on?"checked":""}> <b>Voice ${i+1}</b></label>
      <select>${WAVES.map((w,j)=>`<option value="${j}" ${j==v.wave?"selected":""}>${w}</option>`).join("")}</select>
      <span class="sp"></span><button data-r>🎲</button><button data-c>copy→</button></div>`;
    const cb=d.querySelector("input"),sel=d.querySelector("select");
    cb.onchange=()=>{v.on=cb.checked;d.classList.toggle("off",!v.on);changed()};
    sel.onchange=()=>{v.wave=+sel.value;changed()};
    d.querySelector("[data-r]").onclick=()=>{randVoice(v);v.on=true;buildUI();changed()};
    d.querySelector("[data-c]").onclick=()=>{const n=state.v[(i+1)%4];Object.assign(n,JSON.parse(JSON.stringify(v)));buildUI();changed()};
    VP.forEach(p=>syncers.push(slider(d,v,p,changed)));
    vs.appendChild(d);
  });
}
let timer;
function changed(){last=null;if(document.getElementById("auto").checked){clearTimeout(timer);timer=setTimeout(play,120)}}
function setState(s){state=s;buildUI();play()}

// ---------- randomize / presets ----------
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1));
function randVoice(v){
  Object.assign(v,newVoice(0));v.on=true;
  v.wave=RI(0,WAVES.length-1);v.freq=Math.exp(R(Math.log(80),Math.log(1600)));
  v.slide=R(-1.5,1.5)*(Math.random()<.5?0:1);v.dslide=Math.random()<.7?0:R(-3,3);
  v.vibD=Math.random()<.7?0:R(0,.6);v.arp=Math.random()<.6?0:RI(-12,12);v.arpT=R(.03,.2);
  v.duty=R(.1,.9);v.dutyS=Math.random()<.7?0:R(-.6,.6);
  v.att=Math.random()<.7?.003:R(0,.1);v.sus=R(.02,.3);v.dec=R(.05,.5);v.punch=R(0,.6);
  v.lp=Math.random()<.6?20000:Math.exp(R(Math.log(500),Math.log(12000)));v.hp=Math.random()<.7?20:R(50,1500);
  v.pan=R(-.6,.6);v.vol=.6;
}
function randomAll(){
  state=newState();state.g.rate=[11025,22050,22050,44100][RI(0,3)];
  const n=RI(1,3);state.v.forEach((v,i)=>{if(i<n){randVoice(v);v.delay=i*R(0,.08);}else v.on=false});
  buildUI();play();
}
function mutate(){
  state.v.forEach(v=>{if(!v.on)return;VP.forEach(([k,,mn,mx])=>{if(k=="delay"||Math.random()<.6)return;
    v[k]=Math.min(mx,Math.max(mn,v[k]+(Math.random()-.5)*(mx-mn)*.1))})});
  buildUI();play();
}
const PRESETS={
 "Coin / Pickup":s=>{const v=s.v[0];Object.assign(v,{wave:0,freq:988,arp:5,arpT:.07,duty:.4,sus:.08,dec:.25,punch:.4,att:.002});
   Object.assign(s.v[1],{on:true,wave:0,freq:1976,arp:5,arpT:.07,duty:.25,sus:.06,dec:.25,vol:.25,delay:.01});},
 "Laser":s=>Object.assign(s.v[0],{wave:1,freq:1400,slide:-2.2,sus:.05,dec:.2,hp:200,punch:.3}),
 "Explosion":s=>{s.g.rate=22050;Object.assign(s.v[0],{wave:4,freq:200,slide:-.8,sus:.2,dec:.8,lp:3000,lpS:-1.5,punch:.8,vol:.9});
   Object.assign(s.v[1],{on:true,wave:4,freq:70,slide:-.5,sus:.1,dec:.9,lp:600,vol:.8,pan:.2});},
 "Jump":s=>Object.assign(s.v[0],{wave:0,freq:260,slide:1.8,duty:.5,sus:.08,dec:.15}),
 "Hit / Hurt":s=>{Object.assign(s.v[0],{wave:4,freq:300,slide:-1,sus:.03,dec:.12,punch:.6});
   Object.assign(s.v[1],{on:true,wave:1,freq:180,slide:-1.5,sus:.04,dec:.14,vol:.5});},
 "Powerup":s=>Object.assign(s.v[0],{wave:0,freq:300,slide:1.2,dslide:0,vibD:.15,vibS:14,sus:.25,dec:.25,duty:.3}),
 "16-bit chord (4 voice)":s=>{s.g.rate=32000;
   [[262,0],[330,4],[392,7],[523,12]].forEach(([f,a],i)=>Object.assign(s.v[i],{on:true,wave:[2,0,6,5][i],freq:f,arp:0,att:.01,sus:.3,dec:.5,vol:.45,pan:[-.6,-.2,.2,.6][i],delay:i*.06,vibD:.05,vibS:6,lp:6000}));},
 "16-bit arp riff":s=>{s.g.rate=32000;
   Object.assign(s.v[0],{wave:6,freq:220,arp:12,arpT:.06,sus:.7,dec:.2,vol:.5,pan:-.4});
   Object.assign(s.v[1],{on:true,wave:2,freq:110,sus:.7,dec:.2,vol:.7,pan:.3});
   Object.assign(s.v[2],{on:true,wave:5,freq:880,arp:7,arpT:.12,sus:.6,dec:.3,vol:.2,pan:.5,lp:5000});},
 "Blip (8-bit crunch)":s=>{s.g.bits=6;s.g.down=3;s.g.rate=16000;Object.assign(s.v[0],{wave:0,freq:600,duty:.125,sus:.04,dec:.05});},
};
function loadPreset(name){const s=newState();PRESETS[name](s);setState(s)}
Object.keys(PRESETS).forEach(n=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>loadPreset(n);document.getElementById("presets").appendChild(b)});

// ---------- wiring ----------
const $=id=>document.getElementById(id);
$("play").onclick=play;
$("random").onclick=randomAll;
$("mutate").onclick=mutate;
$("download").onclick=()=>{const b=last||render();const a=document.createElement("a");a.href=URL.createObjectURL(toWav(b));a.download="sfx_"+Date.now()+".wav";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$("saveJson").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:"application/json"}));a.download="patch.json";a.click()};
$("loadJson").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(s.g&&s.v)setState(s)}catch(x){alert("Invalid patch")}e.target.value=""};
addEventListener("keydown",e=>{if(e.code=="Space"&&!/INPUT|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();play()}});

state=newState();Object.assign(state.v[0],{wave:0,freq:660,arp:7,arpT:.08,sus:.1,dec:.2,punch:.3});
buildUI();last=render();draw(last);
</script>
</body>
</html>
