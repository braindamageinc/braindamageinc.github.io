<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Index Overlay</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #1e1e1e; color: #eee; }
  h1 { font-size: 1.2rem; margin-top: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  label { display: flex; gap: 6px; align-items: center; }
  input[type=number] { width: 70px; }
  button { padding: 6px 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #info { margin-bottom: 8px; color: #9cf; }
  .canvas-wrap { overflow: auto; max-width: 100%; border: 1px solid #444; display: inline-block; background:
    repeating-conic-gradient(#888 0% 25%, #aaa 0% 50%) 50% / 16px 16px; }
  canvas { display: block; max-width: 100%; height: auto; }
</style>
</head>
<body>
<h1>Grid Index Overlay</h1>
<div class="controls">
  <input type="file" id="file" accept="image/*">
  <label>Rows <input type="number" id="rows" min="1" value="4"></label>
  <label>Columns <input type="number" id="cols" min="1" value="4"></label>
  <button id="download" disabled>Download PNG</button>
</div>
<div id="info">No image loaded.</div>
<div class="canvas-wrap"><canvas id="canvas" width="0" height="0"></canvas></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), ctx = canvas.getContext('2d');
  let img = null, fileName = 'image';

  function render() {
    if (!img) return;
    const w = img.naturalWidth, h = img.naturalHeight;
    const rows = Math.max(1, parseInt($('rows').value) || 1);
    const cols = Math.max(1, parseInt($('cols').value) || 1);
    canvas.width = w; canvas.height = h;
    ctx.drawImage(img, 0, 0);

    ctx.fillStyle = 'black';
    ctx.font = '20px Arial, sans-serif';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';

    const cw = Math.floor(w / cols), ch = Math.floor(h / rows);

    // Column indices: top and bottom
    for (let c = 0; c < cols; c++) {
      const x = c * cw + Math.floor(cw / 2) - 10;
      ctx.fillText(String(c), x, 0);
      ctx.fillText(String(c), x, h - 20);
    }
    // Row indices (row * cols): left and right
    for (let r = 0; r < rows; r++) {
      const y = r * ch + Math.floor(ch / 2) - 10;
      const t = String(r * cols);
      ctx.fillText(t, 0, y);
      ctx.fillText(t, w - 40, y);
    }
  }

  $('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    fileName = f.name.replace(/\.[^.]+$/, '');
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      img = im;
      $('info').textContent = `${f.name} — ${im.naturalWidth} × ${im.naturalHeight} px`;
      $('download').disabled = false;
      render();
      URL.revokeObjectURL(url);
    };
    im.onerror = () => {
      $('info').textContent = 'Could not load that file as an image.';
      URL.revokeObjectURL(url);
    };
    im.src = url;
  });

  $('rows').addEventListener('input', render);
  $('cols').addEventListener('input', render);

  $('download').addEventListener('click', () => {
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${fileName}_with_borders.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });
})();
</script>
</body>
</html>
