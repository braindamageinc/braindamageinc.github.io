<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spritesheet Merger</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f4f4f6; --border:#d0d0d8; --accent:#3b6cf6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --fg:#eee; --muted:#999; --card:#222228; --border:#3a3a44; --accent:#6c93ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:1100px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  h2 { font-size:16px; margin:20px 0 8px; }
  #drop { border:2px dashed var(--border); border-radius:8px; padding:24px; text-align:center; color:var(--muted); }
  #drop.over { border-color:var(--accent); color:var(--accent); }
  button, label.btn { font:inherit; padding:6px 12px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover:not(:disabled), label.btn:hover { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  input[type=file] { display:none; }
  #list { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-bottom:8px; }
  .item { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:6px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .thumb { height:96px; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:4px; background:
    repeating-conic-gradient(#8884 0 25%, transparent 0 50%) 0 0/16px 16px; }
  .thumb img { max-width:100%; max-height:100%; image-rendering:pixelated; }
  .name { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .res { font-size:12px; color:var(--muted); }
  .actions { display:flex; gap:4px; }
  .actions button { padding:0 8px; flex:1; }
  .opts { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin:8px 0; }
  .opts input[type=number] { width:70px; }
  #preview { overflow:auto; border:1px solid var(--border); border-radius:8px; background:
    repeating-conic-gradient(#8884 0 25%, transparent 0 50%) 0 0/16px 16px; }
  #preview canvas { display:block; image-rendering:pixelated; }
  #info { color:var(--muted); margin:6px 0; }
  .err { color:#d33; }
</style>
</head>
<body>
<h1>Spritesheet Merger</h1>

<div id="drop">
  Drag &amp; drop frame images here, or
  <label class="btn">Choose images<input id="file" type="file" accept="image/*" multiple></label>
</div>
<div id="errors" class="err"></div>

<h2>Loaded frames (<span id="count">0</span>)</h2>
<div id="list"></div>
<p id="empty" style="color:var(--muted)">No images loaded.</p>
<button id="clear" disabled>Clear all</button>

<h2>Spritesheet</h2>
<div class="opts">
  <label>Columns <input id="cols" type="number" min="1" value="1"></label>
  <label>Padding (px) <input id="pad" type="number" min="0" value="0"></label>
  <label>Frame alignment
    <select id="align"><option value="topleft">Top-left</option><option value="center">Center</option></select>
  </label>
  <label>Background
    <select id="bg"><option value="transparent">Transparent</option><option value="#000000">Black</option><option value="#ffffff">White</option></select>
  </label>
  <label><input id="pow2" type="checkbox"> Power-of-two size</label>
</div>
<div id="info"></div>
<div id="preview"></div>
<p><button id="download" class="primary" disabled>Download PNG</button></p>

<script>
"use strict";
const $ = id => document.getElementById(id);
const items = []; // {name, img, url, w, h}
const canvas = document.createElement("canvas");
$("preview").appendChild(canvas);
let colsTouched = false;

function addFiles(files) {
  $("errors").textContent = "";
  // Keep selection order stable even though images load asynchronously.
  const list = [...files];
  let pending = list.length;
  const loaded = new Array(list.length);
  const done = () => {
    if (--pending) return;
    for (const it of loaded) if (it) items.push(it);
    if (!colsTouched) $("cols").value = Math.max(1, Math.ceil(Math.sqrt(items.length)));
    render();
  };
  list.forEach((f, idx) => {
    if (!f.type.startsWith("image/")) { $("errors").textContent += `Skipped ${f.name}: not an image. `; return done(); }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { loaded[idx] = { name: f.name, img, url, w: img.naturalWidth, h: img.naturalHeight }; done(); };
    img.onerror = () => { URL.revokeObjectURL(url); $("errors").textContent += `Failed to load ${f.name}. `; done(); };
    img.src = url;
  });
}

function renderList() {
  const list = $("list");
  list.textContent = "";
  $("count").textContent = items.length;
  $("empty").hidden = items.length > 0;
  items.forEach((it, i) => {
    const el = document.createElement("div");
    el.className = "item";
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const im = document.createElement("img");
    im.src = it.url; im.alt = it.name;
    thumb.appendChild(im);
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = `${i + 1}. ${it.name}`; nm.title = it.name;
    const rs = document.createElement("div"); rs.className = "res"; rs.textContent = `${it.w} × ${it.h} px`;
    const act = document.createElement("div");
    act.className = "actions";
    const mk = (txt, fn, dis) => { const b = document.createElement("button"); b.textContent = txt; b.disabled = dis; b.onclick = fn; return b; };
    act.append(mk("←", () => move(i, -1), i === 0), mk("→", () => move(i, 1), i === items.length - 1), mk("✕", () => remove(i), false));
    el.append(thumb, nm, rs, act);
    list.appendChild(el);
  });
}

function move(i, d) { [items[i], items[i + d]] = [items[i + d], items[i]]; render(); }
function remove(i) { URL.revokeObjectURL(items[i].url); items.splice(i, 1); render(); }

const nextPow2 = n => { let p = 1; while (p < n) p <<= 1; return p; };

function drawMerged() {
  const ctx = canvas.getContext("2d");
  const n = items.length;
  if (!n) {
    canvas.width = canvas.height = 0;
    $("info").textContent = "";
    $("download").disabled = true;
    return;
  }
  const cols = Math.min(n, Math.max(1, parseInt($("cols").value) || 1));
  const rows = Math.ceil(n / cols);
  const pad = Math.max(0, parseInt($("pad").value) || 0);
  const cw = Math.max(...items.map(i => i.w));
  const ch = Math.max(...items.map(i => i.h));
  let w = cols * cw + pad * (cols - 1);
  let h = rows * ch + pad * (rows - 1);
  if ($("pow2").checked) { w = nextPow2(w); h = nextPow2(h); }
  if (w > 16384 || h > 16384) {
    $("info").innerHTML = `<span class="err">Result ${w}×${h} exceeds the 16384px canvas limit. Adjust columns.</span>`;
    $("download").disabled = true;
    return;
  }
  canvas.width = w; canvas.height = h;
  ctx.imageSmoothingEnabled = false;
  const bg = $("bg").value;
  if (bg !== "transparent") { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); }
  const center = $("align").value === "center";
  items.forEach((it, i) => {
    const x = (i % cols) * (cw + pad) + (center ? Math.floor((cw - it.w) / 2) : 0);
    const y = Math.floor(i / cols) * (ch + pad) + (center ? Math.floor((ch - it.h) / 2) : 0);
    ctx.drawImage(it.img, x, y);
  });
  $("info").textContent = `${w} × ${h} px — ${cols} column${cols > 1 ? "s" : ""} × ${rows} row${rows > 1 ? "s" : ""}, cell ${cw} × ${ch} px, ${n} frame${n > 1 ? "s" : ""}`;
  $("download").disabled = false;
}

function render() {
  renderList();
  drawMerged();
  $("clear").disabled = !items.length;
}

$("file").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("clear").onclick = () => { items.forEach(i => URL.revokeObjectURL(i.url)); items.length = 0; colsTouched = false; render(); };
$("cols").oninput = () => { colsTouched = true; drawMerged(); };
for (const id of ["pad", "align", "bg", "pow2"]) $(id).oninput = drawMerged;

const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));

$("download").onclick = () => {
  canvas.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "spritesheet.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
};

render();
</script>
</body>
</html>
